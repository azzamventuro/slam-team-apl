root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main.exe ./cmd/api"
  bin = "tmp/main.exe"
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  exclude_dir = ["bin", "tmp", "vendor", "docs"]
  delay = 1000
  stop_on_error = true
  log = "build-errors.log"

[log]
  time = true

[misc]
  clean_on_exit = true
