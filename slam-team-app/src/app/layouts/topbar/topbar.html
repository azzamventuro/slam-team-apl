<nav class="topbar">
  <button
    type="button"
    class="topbar__toggle d-lg-none"
    aria-controls="app-sidebar"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="'MENU.TOGGLE' | translate"
    (click)="toggleMenu.emit()"
  >
    <span aria-hidden="true">☰</span>
  </button>

  <span class="topbar__title">{{ 'APP.TITLE' | translate }}</span>

  <div class="topbar__actions">
    <div class="btn-group" role="group" [attr.aria-label]="'COMMON.LANGUAGE' | translate">
      @for (lang of languages; track lang) {
        <button
          type="button"
          class="btn btn-sm topbar__lang"
          [class.active]="currentLang() === lang"
          [attr.aria-pressed]="currentLang() === lang"
          (click)="switchLang(lang)"
        >
          {{ lang }}
        </button>
      }
    </div>

    @if (user(); as u) {
      <span class="topbar__user">
        <span class="topbar__avatar" aria-hidden="true">{{ initial(u.name) }}</span>
        <span class="d-none d-sm-inline">{{ u.name }}</span>
      </span>
    }

    <button type="button" class="btn btn-sm btn-outline-light" (click)="logout()">
      {{ 'MENU.LOGOUT' | translate }}
    </button>
  </div>
</nav>
