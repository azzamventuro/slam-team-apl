<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="mb-0">{{ 'DASHBOARD.TITLE' | translate }}</h3>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    @if (user(); as u) {
      <p class="mb-1">{{ 'DASHBOARD.WELCOME' | translate }}, <strong>{{ u.name }}</strong></p>
      <p class="text-muted mb-0">{{ u.email }}</p>
    }
  </div>
</div>
