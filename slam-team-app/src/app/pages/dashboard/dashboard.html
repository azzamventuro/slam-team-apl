<header class="page-head">
  <div>
    <p class="slam-eyebrow">{{ 'MENU.GROUP.MAIN' | translate }}</p>
    <h1 class="h3 mb-0">{{ 'DASHBOARD.TITLE' | translate }}</h1>
  </div>
</header>

<div class="card">
  <div class="card-body">
    @if (user(); as u) {
      <p class="slam-eyebrow mb-2">{{ 'DASHBOARD.WELCOME' | translate }}</p>
      <p class="dashboard-name">{{ u.nama }}</p>
      <p class="dashboard-email mb-0">{{ u.email }}</p>
    } @else {
      <p class="text-secondary mb-0">{{ 'COMMON.EMPTY' | translate }}</p>
    }
  </div>
</div>
