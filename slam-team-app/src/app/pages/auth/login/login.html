<div class="login-page d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-sm" style="width: 22rem">
    <div class="card-body">
      <h4 class="card-title text-center mb-4">{{ 'LOGIN.TITLE' | translate }}</h4>

      @if (error(); as err) {
        <div class="alert alert-danger py-2">{{ err | translate }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">{{ 'LOGIN.EMAIL' | translate }}</label>
          <input type="email" class="form-control" formControlName="email" autocomplete="username" />
        </div>
        <div class="mb-3">
          <label class="form-label">{{ 'LOGIN.PASSWORD' | translate }}</label>
          <input
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
          />
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
          {{ 'LOGIN.SUBMIT' | translate }}
        </button>
      </form>
    </div>
  </div>
</div>
